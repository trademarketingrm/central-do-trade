<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Moura | Central do Trade</title>

    <style>

        :root{
            --azul:#0057B8;
            --fundo:#F5F7FA;
            --texto:#2D3748;
            --branco:#FFFFFF;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Segoe UI", sans-serif;
        }

        body{
            background:var(--fundo);
            color:var(--texto);
        }

        .container{
            max-width:800px;
            margin:auto;
            padding:50px 25px;
        }

        h1{
            text-align:center;
            color:var(--azul);
            margin-bottom:40px;
            font-size:42px;
        }

        .botoes{
            display:flex;
            flex-direction:column;
            gap:20px;
        }

        .botao{
            background:var(--branco);
            color:var(--azul);
            text-decoration:none;
            text-align:center;
            padding:22px;
            border-radius:18px;
            font-size:18px;
            font-weight:600;
            box-shadow:0 4px 14px rgba(0,0,0,.08);
            transition:.2s;
        }

        .botao:hover{
            transform:translateY(-4px);
            box-shadow:0 8px 20px rgba(0,0,0,.12);
        }

        .card-contato{
            background:var(--branco);
            padding:22px;
            border-radius:18px;
            margin-top:20px;
            box-shadow:0 4px 14px rgba(0,0,0,.08);
            text-align:center;
        }

        .card-contato h3{
            color:var(--azul);
            margin-bottom:12px;
        }

        .card-contato p{
            margin:6px 0;
            font-size:18px;
        }

        .voltar{
            display:block;
            text-align:center;
            margin-top:40px;
            color:#666;
            text-decoration:none;
            font-size:16px;
        }

        .voltar:hover{
            color:var(--azul);
        }

        @media(max-width:768px){

            h1{
                font-size:32px;
            }

            .botao{
                font-size:16px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Academia Moura</h1>

        <div class="botoes">

            <a class="botao"
               href="https://ead.academiamoura.com.br/"
               target="_blank">
                🖥️ Plataforma da Academia Moura
            </a>

            <a class="botao"
               href="https://redemoura4.sharepoint.com/:f:/r/sites/TRADEMARKETINGREDEMOURA/Documentos%20Compartilhados/Academia%20Moura?d=w3da409ad82bb4ccf8697632ced0fde5d&csf=1&web=1&e=EVaMdx"
               target="_blank">
                📚 Materiais da Academia Moura
            </a>

        </div>

        <div class="card-contato">
            <h3>☎️ Suporte Academia Moura</h3>
            <p>+55 81 9180-9152</p>
        </div>

        <a class="voltar" href="index.html">
            ← Voltar para a página inicial
        </a>

    </div>

</body>

</html>
