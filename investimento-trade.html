<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investimento Trade | Central do Trade</title>

    <style>

        :root{
            --azul:#0057B8;
            --fundo:#F5F7FA;
            --texto:#2D3748;
            --branco:#FFFFFF;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Segoe UI", sans-serif;
        }

        body{
            background:var(--fundo);
            color:var(--texto);
        }

        .container{
            max-width:800px;
            margin:auto;
            padding:50px 25px;
        }

        h1{
            text-align:center;
            color:var(--azul);
            margin-bottom:40px;
            font-size:42px;
        }

        .botoes{
            display:flex;
            flex-direction:column;
            gap:20px;
        }

        .botao{
            background:var(--branco);
            color:var(--azul);
            text-decoration:none;
            text-align:center;
            padding:22px;
            border-radius:18px;
            font-size:18px;
            font-weight:600;
            box-shadow:0 4px 14px rgba(0,0,0,.08);
            transition:.2s;
        }

        .botao:hover{
            transform:translateY(-4px);
            box-shadow:0 8px 20px rgba(0,0,0,.12);
        }

        .voltar{
            display:block;
            text-align:center;
            margin-top:40px;
            color:#666;
            text-decoration:none;
            font-size:16px;
        }

        .voltar:hover{
            color:var(--azul);
        }

        @media(max-width:768px){

            h1{
                font-size:32px;
            }

            .botao{
                font-size:16px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Investimento Trade</h1>

       target="_blank">
                📊 Acompanhamento de verba
            </a>

            <a class="botao" href="https://redemoura4.sharepoint.com/:x:/r/sites/TRADEMARKETINGREDEMOURA/Documentos%20Compartilhados/Diagn%C3%B3stico%20Trade/6.%20Investimento%20Trade%20-%20Detalhamento.xlsx?d=wbd70cbb22c6e45a9967957af969e0ff7&csf=1&web=1&e=jQnCtk"
       target="_blank">
                📒 Contas do Investimento Trade
            </a>

            <a class="botao" href="https://redemoura4.sharepoint.com/:v:/r/sites/TRADEMARKETINGREDEMOURA/Documentos%20Compartilhados/Diagn%C3%B3stico%20Trade/3.%20Simula%C3%A7%C3%A3o%20-%20Diagn%C3%B3stico%20Trade%20e%20ITB.mp4?d=waf829d7556a942678282b448e63daed6&csf=1&web=1&e=lSqKyX"
       target="_blank">

        </div>
